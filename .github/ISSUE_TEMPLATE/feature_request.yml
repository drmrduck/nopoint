name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's painful about how it works now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like NoPoint to behave? Concrete shapes welcome — file paths, API sketches, mockups.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why they don't fit.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links to related issues, examples from other tools, prior art.
    validations:
      required: false
